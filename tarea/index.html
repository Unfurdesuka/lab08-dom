<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarea Lab 08 - Gestor de Tareas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 30px auto; }
    section { border: 1px solid #ccc; padding: 12px; margin-bottom: 16px; }
    .destacado { background: #fff3cd; }
    .error { color: #c0392b; }
    .completada { text-decoration: line-through; color: #7f8c8d; }
    li { margin-bottom: 8px; }
    li button { margin-left: 8px; }
  </style>
</head>
<body>
  <h1 id="titulo">Gestor de Tareas Pendientes</h1>

  <section>
    <h2>Agregar nueva tarea</h2>
    <form id="formTarea">
      <input id="inputTitulo" type="text" placeholder="Escribe una tarea...">
      <select id="selectPrioridad">
        <option value="Alta">Alta</option>
        <option value="Media" selected>Media</option>
        <option value="Baja">Baja</option>
      </select>
      <button type="submit">Agregar</button>
    </form>
    <p id="vistaPrevia">Vista previa: ...</p>
    <p id="mensajeEstado"></p>
  </section>

  <section>
    <h2>Lista de tareas (<span id="totalTareas">0</span>)</h2>
    <button id="btnLimpiarCompletadas">Eliminar completadas</button>
    <ul id="listaTareas"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
